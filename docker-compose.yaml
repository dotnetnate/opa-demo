version: '3.8'

services:
  opa:
    image: ghcr.io/styrainc/enterprise-opa:1.30.0
    ports:
      - "8181:8181"
    command: "run --server --config-file /opa-config.yaml --addr=0.0.0.0:8181"
    environment:
      EOPA_LICENSE_KEY: A6C90F-A17840-DB0781-A1E35C-868E95-V3
    volumes:
      - ./opa-config.yaml:/opa-config.yaml
      - opa_data:/opt/opa/data        

  mongodb:
    image: mongo:latest
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: example
    volumes:
      - mongo_data:/data/db

  oauth-mock-server:
    image: opa-demo-oauth-mock-server:latest
    ports:
      - "8081:9000"
    environment:            
      - TENANT_ID={dedf9bbb-a700-444b-b576-7bf93859f73d}
    volumes:
      - ./certs:/app/certs      

  nginx:
    image: nginx:latest
    ports:
      - "80:80"
    volumes:
      - ./html:/usr/share/nginx/html
      - ./bundles:/usr/share/nginx/html/bundles
      - ./nginx.conf:/etc/nginx/nginx.conf

volumes:
  mongo_data:
  opa_data: